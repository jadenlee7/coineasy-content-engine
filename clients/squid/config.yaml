client_id: squid
name: Squid
locale: ko-KR
active: true

brand:
  # Figma "Squid Korea branding" 대조갱신 — 라임그린 + 라벤더 퍼플 (구 민트 #00F5D4)
  primary_color: "#E6FA36"   # 라임그린 accent (프레임 배경 실측)
  bg_dark: "#1A0E2E"         # 딥 퍼플 (Squid는 솔리드 다크 토큰 없음 — 브랜드 hue 기반 파생)
  bg_yellow: "#BC8EE4"       # Figma Primary Colours 라벤더 퍼플
  text_primary: "#000000"    # 헤딩/본문 블랙 (실측)
  text_body: "#4A4A4A"
  logo_dark: assets/logo_dark.png          # Figma Squid_Logo_White · 다크 배경용
  logo_light: assets/logo_light.png        # Figma Squid_Logo_Black · 밝은 배경용
  font_family: "Pretendard Variable"        # 본문/한글
  # 헤드라인 디스플레이 폰트 (Figma). Bagoss Condensed는 상용(displaay)이라 CDN 없음 —
  # 라이선스 파일을 아래 경로에 넣으면 @font-face로 self-host되어 헤드라인에 자동 적용.
  # 파일이 없으면 헤드라인은 Pretendard로 폴백 (무회귀). 라틴만 Bagoss, 한글은 Pretendard.
  font_display: "Bagoss Condensed"
  font_display_file: "assets/BagossCondensed.woff2"

brand_voice:
  identity:
    - "Short, playful, and unmistakably human"
    - "Product-sharp about seamless cross-chain execution"
    - "Community-aware without becoming generic crypto slang"
    - "Confident through brevity rather than formal explanation"
  avoid:
    - "Corporate press-release tone"
    - "Long explanatory intros before the product point"
    - "Generic cross-chain hype or invented performance claims"
    - "Any legacy two-word variant as the display brand name"
  writing_patterns:
    - "Use a question, one-liner, or compact list as the hook"
    - "Keep deliberate line breaks and short sentence rhythm"
    - "Let product names, integrations, and visuals carry the proof"
    - "Use wit sparingly and only when the source is playful"
  source_fidelity:
    default: 90
    x: 95
    telegram: 85
    banner: 92
    education: 80
  channel_guidance:
    x: "Mirror the original post's brevity, line breaks, humor, and energy; do not turn a one-liner into a formal explainer."
    telegram: "Keep the Squid hook, add only the context Korean readers need, then CTA, original link, and focused hashtags."
    banner: >-
      Treat the official creative as the final composition. If it contains meaningful
      editorial copy, replace only that copy with concise natural Korean in the same
      hierarchy and alignment. If it contains no translatable copy, preserve the
      character and visual untouched. Never add a headline panel, badge, footer, CTA,
      or duplicate logo. Korean text must never sit on a solid caption box or blurred
      image patch; cover the original copy only with a transparent outline and shadow
      that follows the replacement glyphs. Keep the source line count and visual width;
      a short repeated Latin keyword may remain when it carries the original rhythm.
    education: "Stay approachable and builder-focused, using short explanations and concrete cross-chain UX examples."
  reference_examples:
    - type: "community one-liner"
      url: "https://x.com/squidrouter/status/2078510114705997829"
      text: "how it feels to be a Squid / iykyk"
    - type: "product hook"
      url: "https://x.com/squidrouter/status/2077425019547005429"
      text: >-
        Need XRP anywhere? we got you. Swap between XRP and RLUSD directly in
        D-CENT Wallets. Powered by yours truly.
    - type: "compact capability list"
      url: "https://x.com/squidrouter/status/2077817328901796275"
      text: "App. API. SDK. Widget. Protocol. Accounts. Aggregator. EVERYTHING. full stack Squid."

content_sources:
  twitter:
    handle: "@SquidRouter"
    poll_interval_min: 30

llm:
  edu_carousel:
    temperature: 0.3
    tone_guidance: >
      Approachable and builder-focused. 경어체.
      Emphasize cross-chain UX and developer simplicity.
    preserve_terms:
      - "Squid"
      - "Axelar"
      - "ITS"
      - "GMP"
      - "Coral"
    glossary:
      "cross-chain": "크로스체인(cross-chain)"
      "swap": "스왑(swap)"
      "routing": "라우팅(routing)"
      "bridging": "브리징(bridging)"
      "gas abstraction": "가스 추상화(gas abstraction)"

  news_card:
    temperature: 0.2
    tone_guidance: >
      Approachable and builder-focused. 경어체.
      Emphasize cross-chain UX and developer simplicity.
    preserve_terms:
      - "Squid"
      - "Axelar"
      - "ITS"
      - "GMP"
      - "Coral"
    glossary:
      "cross-chain": "크로스체인(cross-chain)"
      "swap": "스왑(swap)"
      "routing": "라우팅(routing)"
      "bridging": "브리징(bridging)"
      "gas abstraction": "가스 추상화(gas abstraction)"

publishing:
  typefully:
    social_set_id: 291349
    active: true
  telegram:
    public_channel: "@SquidKorea"
    bot_token_env: "TELEGRAM_BOT_TOKEN_SQUID"
    bot_env: TELEGRAM_BOT_TOKEN_SQUID
    channel_env: TELEGRAM_CHANNEL_SQUID
    active: true
  twitter:
    typefully_account_id: "squid_kr"

feature_flags:
  auto_approve: false
  education_carousel: true
  news_card: true

routing:
  skip_patterns:
    - "Day 1"
    - "on the ground"
    - "AMA"

  edu_signals:
    - "how it works"
    - "architecture"
    - "routing"
    - "cross-chain"
    - "swap"

  news_signals:
    - "partnership"
    - "integration"
    - "now live"
    - "launch"
