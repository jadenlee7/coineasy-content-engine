client_id: squid
name: Squid Router
locale: ko-KR
active: true

brand:
  # Figma "Squid Korea branding" 대조갱신 — 라임그린 + 라벤더 퍼플 (구 민트 #00F5D4)
  primary_color: "#E6FA36"   # 라임그린 accent (프레임 배경 실측)
  bg_dark: "#1A0E2E"         # 딥 퍼플 (Squid는 솔리드 다크 토큰 없음 — 브랜드 hue 기반 파생)
  bg_yellow: "#B18AE0"       # 라벤더 퍼플 (그라디언트 실측 대표값)
  text_primary: "#000000"    # 헤딩/본문 블랙 (실측)
  text_body: "#4A4A4A"
  logo_dark: assets/logo_dark.png
  logo_light: assets/logo_light.png
  font_family: "Pretendard Variable"   # 한글 본문용. Figma 헤드라인 디스플레이 폰트는 "Bagoss Condensed"(라틴 전용)

content_sources:
  twitter:
    handle: "@SquidRouter"
    poll_interval_min: 30

llm:
  edu_carousel:
    temperature: 0.3
    tone_guidance: >
      Approachable and builder-focused. 경어체.
      Emphasize cross-chain UX and developer simplicity.
    preserve_terms:
      - "Squid Router"
      - "Axelar"
      - "ITS"
      - "GMP"
      - "Coral"
    glossary:
      "cross-chain": "크로스체인(cross-chain)"
      "swap": "스왑(swap)"
      "routing": "라우팅(routing)"
      "bridging": "브리징(bridging)"
      "gas abstraction": "가스 추상화(gas abstraction)"

  news_card:
    temperature: 0.2
    tone_guidance: >
      Approachable and builder-focused. 경어체.
      Emphasize cross-chain UX and developer simplicity.
    preserve_terms:
      - "Squid Router"
      - "Axelar"
      - "ITS"
      - "GMP"
      - "Coral"
    glossary:
      "cross-chain": "크로스체인(cross-chain)"
      "swap": "스왑(swap)"
      "routing": "라우팅(routing)"
      "bridging": "브리징(bridging)"
      "gas abstraction": "가스 추상화(gas abstraction)"

publishing:
  typefully:
    social_set_id: 291349
    active: true
  telegram:
    public_channel: "@SquidKorea"
    bot_token_env: "TELEGRAM_BOT_TOKEN_SQUID"
    bot_env: TELEGRAM_BOT_TOKEN_SQUID
    channel_env: TELEGRAM_CHANNEL_SQUID
    active: true
  twitter:
    typefully_account_id: "squid_kr"

feature_flags:
  auto_approve: false
  education_carousel: true
  news_card: true

routing:
  skip_patterns:
    - "Day 1"
    - "on the ground"
    - "AMA"

  edu_signals:
    - "how it works"
    - "architecture"
    - "routing"
    - "cross-chain"
    - "swap"

  news_signals:
    - "partnership"
    - "integration"
    - "now live"
    - "launch"
