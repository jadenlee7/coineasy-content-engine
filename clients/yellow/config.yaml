client_id: yellow
name: Yellow Network
locale: ko-KR
active: true

brand:
  # Figma "Yellow Korea branding" 대조갱신 — 카드 프레임 실측값
  primary_color: "#FDDA16"               # 브랜드 옐로우 (구 #FFDE00)
  bg_dark: "#000000"
  bg_yellow: "#FDDA16"                    # accent = primary
  text_primary: "#19191C"                # 헤딩 잉크 (구 #0A0A0A)
  text_body: "#555555"                   # 본문 그레이 (구 #595959)
  logo_dark: assets/logo_dark.svg        # Figma 공식 워드마크 · 다크 배경용 흰색 변형
  logo_light: assets/logo_light.svg      # Figma 공식 검정 워드마크
  font_family: "Pretendard Variable"

brand_voice:
  identity:
    - "Institutional and infrastructure-led"
    - "Analytical, direct, and evidence-aware"
    - "Confident about settlement and clearing without hype"
    - "Explains market friction before presenting Yellow's role"
  avoid:
    - "Meme-first or overly casual phrasing"
    - "Generic excitement such as 혁신적, 게임체인저, 대박"
    - "Claims of adoption, compliance, or availability absent from the source"
    - "More emojis or hashtags than the original post needs"
  writing_patterns:
    - "Open with a structural problem or market transition"
    - "Connect the problem to infrastructure, clearing, or settlement"
    - "Use complete, measured paragraphs with precise terminology"
    - "Close with a factual implication or a restrained read-more CTA"
  source_fidelity:
    default: 90
    x: 95
    telegram: 85
    banner: 90
    education: 80
  channel_guidance:
    x: "Preserve the original thesis, paragraph flow, certainty, and restrained energy; add no generic Korean marketing hook."
    telegram: "Add one short Korean relevance sentence, then facts, CTA, original link, and focused hashtags."
    banner: "Use one infrastructure-led headline and only source-supported details; keep the original visual dominant."
    education: "Explain the original mechanism accessibly while preserving technical causality and terminology."
  reference_examples:
    - type: "infrastructure thesis"
      url: "https://x.com/Yellow/status/2078087351893414295"
      text: >-
        Executing every single micro-transaction on-chain is operationally
        unsustainable for modern trading strategies. The future of digital
        assets belongs to off-chain clearing networks.
    - type: "market shift"
      url: "https://x.com/Yellow/status/2078328954574750124"
      text: >-
        Traditional payment rails were engineered for human-speed commerce.
        The agentic economy demands frictionless, machine-speed settlement layers.
    - type: "product utility"
      url: "https://x.com/Yellow/status/2077374193218285825"
      text: >-
        Splitting expenses with crypto friends is a mess. SplitChain, built on
        Yellow SDK, fixes it.

content_sources:
  twitter:
    handle: "@Yellow"                     # 글로벌 공식 계정
    poll_interval_min: 30
  blog_rss:
    - "https://medium.com/yellow-blog/feed"

llm:
  edu_carousel:
    temperature: 0.3
    tone_guidance: >
      Professional but approachable. 경어체 (합니다/습니다).
      Technical but beginner-friendly. 크립토 초보자도 이해할 수 있게.
    preserve_terms:
      - "Nitrolite"
      - "Clearnode"
      - "Yellow SDK"
      - "$YELLOW"
      - "State Channel"
      - "NeoDAX"
      - "XRPL"
      - "EVM"
    glossary:
      "chain-agnostic": "체인을 가리지 않는"
      "state channel": "스테이트 채널(state channel)"
      "state channels": "스테이트 채널(state channels)"
      "non-custodial": "논커스터디얼(non-custodial)"
      "clearing": "클리어링(clearing)"
      "settlement": "정산(settlement)"
      "Layer 3": "Layer 3"
      "cross-chain": "크로스체인(cross-chain)"
      "real-world asset": "실물 자산(real-world asset)"
      "gas fees": "가스비(gas fees)"
      "off-chain": "오프체인(off-chain)"
      "on-chain": "온체인(on-chain)"
      "smart contract": "스마트 컨트랙트(smart contract)"

  news_card:
    temperature: 0.2
    tone_guidance: >
      Professional but approachable. 경어체.
    preserve_terms:
      - "Nitrolite"
      - "Clearnode"
      - "Yellow SDK"
      - "$YELLOW"
      - "State Channel"
      - "NeoDAX"
      - "XRPL"
      - "EVM"
    glossary:
      "chain-agnostic": "체인을 가리지 않는"
      "state channel": "스테이트 채널(state channel)"
      "state channels": "스테이트 채널(state channels)"
      "non-custodial": "논커스터디얼(non-custodial)"
      "clearing": "클리어링(clearing)"
      "settlement": "정산(settlement)"
      "Layer 3": "Layer 3"
      "cross-chain": "크로스체인(cross-chain)"
      "real-world asset": "실물 자산(real-world asset)"
      "gas fees": "가스비(gas fees)"
      "off-chain": "오프체인(off-chain)"
      "on-chain": "온체인(on-chain)"
      "smart contract": "스마트 컨트랙트(smart contract)"

publishing:
  typefully:
    social_set_id: 254669
    active: true
  telegram:
    public_channel: "@YellowKorea_ann"
    # approval_channel_id: -1001234567890     # 제이든+Kailey 승인 채널 ID
    bot_token_env: "TELEGRAM_BOT_TOKEN_YELLOW"
    bot_env: TELEGRAM_BOT_TOKEN_YELLOW
    channel_env: TELEGRAM_CHANNEL_YELLOW
    active: true
  twitter:
    typefully_account_id: "yellow_kr"
  discord:
    enabled: false

feature_flags:
  auto_approve: false
  education_carousel: true
  news_card: true

routing:
  # 1차 필터 - LLM 부르기 전에 제외할 패턴들
  skip_patterns:
    - "Day 1"
    - "Day 2"
    - "on the ground"
    - "Premier Sponsor"
    - "AMA:"
    - "How much"
    - "What do you think"
    - "Live in"
    - "15 minutes"

  # 교육 캐러셀 후보 신호
  edu_signals:
    - "by design"
    - "chain-agnostic"
    - "protocol"
    - "architecture"
    - "infrastructure"
    - "enables"
    - "state channel"
    - "the WHY"
    - "explainer"
    - "here's how"
    - "nitrolite"
    - "clearnode"
    - "SDK"

  # 뉴스 카드 후보 신호
  news_signals:
    - "partnership"
    - "partner"
    - "live on"
    - "mainnet"
    - "launch"
    - "launched"
    - "listing"
    - "integration"
    - "now supports"
    - "milestone"
