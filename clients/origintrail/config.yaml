client_id: origintrail
name: OriginTrail Korea
locale: ko-KR
active: true

# ────────────────────────────────────────────────────
# Brand — Figma "OriginTrail Korea branding" 실측 적용
# ────────────────────────────────────────────────────
brand:
  primary_color: "#6344DF"               # OriginTrail 퍼플 (로고 심볼)
  bg_dark: "#0C2246"                      # 다크 네이비
  bg_yellow: "#6344DF"                    # accent = primary(퍼플)
  text_primary: "#0C2246"                 # 헤딩 잉크 (네이비)
  text_body: "#595959"                    # 본문 그레이 (Figma 본문은 #000, 가독성용 그레이 적용)
  logo_dark: assets/logo_dark.png         # Figma 공식 흰색 워드마크 · 다크 배경용
  logo_light: assets/logo_light.png       # Figma 공식 검정 워드마크 · 밝은 배경용
  font_family: "Gmarket Sans"             # Figma 헤딩/본문 폰트

llm:
  news_card:
    # NOTE: model 라인 없음 — 중앙 디폴트 claude-opus-4-8 상속.
    temperature: 0.2
    tone_guidance: >
      Professional, knowledge-graph 도메인. 경어체(합니다/습니다).
    preserve_terms:
      - "TRAC"
      - "DKG"
      - "Knowledge Asset"
      - "OriginTrail"
      - "Paranet"
      - "Knowledge Mining"
    glossary:
      "Knowledge Asset": "지식 자산(Knowledge Asset)"
      "DKG": "탈중앙 지식 그래프(DKG)"
      "Knowledge Mining": "지식 마이닝(Knowledge Mining)"

publishing:
  # TODO: 실제 크리덴셜 세팅 시 각 채널 active: true 로 전환
  typefully:
    social_set_id: null                  # PLACEHOLDER — Typefully social set 확정 대기
    active: false
  telegram:
    public_channel: "t.me/Origintrailkr"
    bot_token_env: "TELEGRAM_BOT_TOKEN_ORIGINTRAIL"   # env placeholder
    bot_env: TELEGRAM_BOT_TOKEN_ORIGINTRAIL
    channel_env: TELEGRAM_CHANNEL_ORIGINTRAIL         # env placeholder
    active: false
  twitter:
    typefully_account_id: "origin_trail_KR"           # X 게시 대상: @origin_trail_KR
  discord:
    enabled: false

feature_flags:
  auto_approve: false
  education_carousel: false
  news_card: true
