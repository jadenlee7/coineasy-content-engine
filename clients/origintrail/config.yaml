client_id: origintrail
name: OriginTrail Korea
locale: ko-KR
active: true

# ────────────────────────────────────────────────────
# Brand — Figma "OriginTrail Korea branding" 실측 적용
# ────────────────────────────────────────────────────
brand:
  primary_color: "#6344DF"               # OriginTrail 퍼플 (로고 심볼)
  bg_dark: "#0C2246"                      # 다크 네이비
  bg_yellow: "#6344DF"                    # accent = primary(퍼플)
  text_primary: "#0C2246"                 # 헤딩 잉크 (네이비)
  text_body: "#595959"                    # 본문 그레이 (Figma 본문은 #000, 가독성용 그레이 적용)
  logo_dark: assets/logo_dark.png         # Figma 공식 흰색 워드마크 · 다크 배경용
  logo_light: assets/logo_light.png       # Figma 공식 검정 워드마크 · 밝은 배경용
  font_family: "Gmarket Sans"             # Figma 헤딩/본문 폰트

brand_voice:
  identity:
    - "Trust, provenance, and verifiability first"
    - "Thesis-led and logically structured"
    - "Technically credible with real-world proof"
    - "Clear about why connected context matters for AI"
  avoid:
    - "Unverifiable superlatives or token-price language"
    - "Abstract DKG claims without a source, mechanism, or example"
    - "Generic Web3 hype detached from trusted knowledge"
    - "Over-simplification that changes technical meaning"
  writing_patterns:
    - "Start with a short contrast, problem, or trust question"
    - "Explain the causal break in data, memory, or provenance"
    - "Show how shared verifiable context resolves it"
    - "Use a concrete healthcare, security, science, or AI example"
  source_fidelity:
    default: 90
    x: 95
    telegram: 85
    banner: 90
    education: 82
    article: 92
  channel_guidance:
    x: "Keep the source's problem-to-proof logic and terminology; avoid adding a broader AI thesis unless it is explicit."
    telegram: "Lead with the trust problem, explain the verified mechanism, then include CTA, original link, and focused hashtags."
    banner: "When official media is attached, preserve its full composition, official marks, contrast, and proof hierarchy as the dominant visual; add only compact source-supported Korean context and never reconstruct the creative. Without official media, use the OriginTrail classic profile."
    education: "Teach provenance as a causal chain using one source-grounded real-world example."
    article: >-
      Build a problem-to-proof narrative around trust, provenance, or connected
      context. Explain the causal break before the DKG or verifiable mechanism and
      ground the conclusion in the source's real-world example. Keep the technical
      depth high but the Korean causal chain easy to follow. Article visuals should
      make provenance legible through networks, layers, or traceable flows, never
      through abstract AI spectacle or benefits not stated by the source.
  reference_examples:
    - type: "contrast hook"
      url: "https://x.com/origin_trail/status/2078063452996661578"
      text: >-
        Individual memory doesn't scale. Shared context does. Isolated agents
        rebuild the same context again and again.
    - type: "provenance problem"
      url: "https://x.com/origin_trail/status/2076973514217709978"
      text: >-
        Pharma already solved provenance. Every claim traces back. Then
        knowledge reaches an AI model, and the chain breaks.
    - type: "mechanism and proof"
      url: "https://x.com/origin_trail/status/2076757788097724762"
      text: >-
        DKG gives agents shared, verifiable memory. Every signal traces back to
        its source and context stays attached across networks.

content_sources:
  twitter:
    handle: "@origin_trail"
    poll_interval_min: 30

llm:
  news_card:
    # NOTE: model 라인 없음 — 중앙 디폴트 claude-opus-5 상속.
    temperature: 0.2
    tone_guidance: >
      Professional, knowledge-graph 도메인. 경어체(합니다/습니다).
    preserve_terms:
      - "TRAC"
      - "DKG"
      - "Knowledge Asset"
      - "OriginTrail"
      - "Paranet"
      - "Knowledge Mining"
    glossary:
      "Knowledge Asset": "지식 자산(Knowledge Asset)"
      "DKG": "탈중앙 지식 그래프(DKG)"
      "Knowledge Mining": "지식 마이닝(Knowledge Mining)"

publishing:
  # TODO: 실제 크리덴셜 세팅 시 각 채널 active: true 로 전환
  typefully:
    social_set_id: null                  # PLACEHOLDER — Typefully social set 확정 대기
    active: false
  telegram:
    public_channel: "t.me/Origintrailkr"
    bot_token_env: "TELEGRAM_BOT_TOKEN_ORIGINTRAIL"   # env placeholder
    bot_env: TELEGRAM_BOT_TOKEN_ORIGINTRAIL
    channel_env: TELEGRAM_CHANNEL_ORIGINTRAIL         # env placeholder
    active: false
  twitter:
    typefully_account_id: "origin_trail_KR"           # X 게시 대상: @origin_trail_KR
  discord:
    enabled: false

feature_flags:
  auto_approve: false
  education_carousel: false
  news_card: true
