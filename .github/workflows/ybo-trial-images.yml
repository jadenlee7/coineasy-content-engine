name: YBO trial isolated image proof

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-trial-image:
    name: API trial stamp and default-OFF image (no provider)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build API image with a synthetic valid Git SHA
        run: >-
          docker build --file Dockerfile
          --build-arg RAILWAY_GIT_COMMIT_SHA=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          --tag coineasy-ybo-api-ci .
      - name: Read the actual immutable stamp and prove default-OFF without I/O
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python coineasy-ybo-api-ci - <<'PY'
          import asyncio, json, os, pathlib, stat, sys
          def no_io(event, args):
              if event in ('socket.connect', 'socket.bind', 'sqlite3.connect'):
                  raise AssertionError('external_io_forbidden')
          sys.addaudithook(no_io)
          from core.automation.trial_generation_gate import read_image_stamp
          from core.automation.trial_controller import run_hosted_trial
          p = pathlib.Path('/app/coineasy-api-build-sha')
          info = p.lstat()
          assert stat.S_ISREG(info.st_mode) and info.st_uid == 0
          assert stat.S_IMODE(info.st_mode) == 0o444 and p.read_bytes() == b'a' * 40
          assert read_image_stamp() == 'a' * 40
          assert os.environ.get('YBO_TRIAL_CONTROLLER_ENABLED', 'false') == 'false'
          class OnlyFlag:
              def get(self, key, default=None):
                  assert key == 'YBO_TRIAL_CONTROLLER_ENABLED'
                  return 'false'
              def __getitem__(self, key):
                  raise AssertionError('off_read_credentials')
          assert asyncio.run(run_hosted_trial(OnlyFlag())) == {
              'status': 'disabled', 'effective_on': False, 'public_send_attempted': False}
          print(json.dumps({'actual_image_stamp_verified': True, 'default_off': True,
              'network_calls': False, 'database_calls': False, 'provider_calls': False,
              'production_proof': False}))
          PY
      - name: Malformed nonempty SHA must fail the real Docker build
        shell: bash
        run: |
          set -euo pipefail
          if docker build --file Dockerfile \
            --build-arg RAILWAY_GIT_COMMIT_SHA=not-a-git-sha \
            --tag coineasy-ybo-api-invalid-ci .; then
            echo 'Invalid nonempty SHA unexpectedly built' >&2
            exit 1
          fi
      - name: Optional absent SHA preserves ordinary build compatibility
        run: >-
          docker build --file Dockerfile --build-arg RAILWAY_GIT_COMMIT_SHA=
          --tag coineasy-ybo-api-unstamped-ci .
      - name: An unstamped real image cannot admit a configured trial
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python coineasy-ybo-api-unstamped-ci - <<'PY'
          import json, pathlib, sys
          def no_io(event, args):
              if event in ('socket.connect', 'socket.bind', 'sqlite3.connect'):
                  raise AssertionError('external_io_forbidden')
          sys.addaudithook(no_io)
          from core.automation.trial_generation_gate import TrialGenerationGate, TrialGenerationDenied
          from core.automation.trial_owner import POLICY_SHA256, canonical_sha256
          assert not pathlib.Path('/app/coineasy-api-build-sha').exists()
          plan = {'contract': 'ybo-server-trial@1',
              'trial_id': '11111111-1111-4111-8111-111111111111',
              'not_before': '2026-10-14T00:00:00Z', 'deadline': '2026-10-14T02:00:00Z',
              'kst_date': '2026-10-14', 'client_ids': ['yellow', 'babylon', 'origintrail'],
              'max_per_client': 1, 'max_total': 3, 'estimated_daily_limit_micros': 10_000_000,
              'estimate_policy_sha256': POLICY_SHA256, 'release_sha': 'a' * 40}
          env = {'YBO_TRIAL_API_MODE': 'true', 'YBO_TRIAL_PLAN_JSON': json.dumps(plan),
              'YBO_TRIAL_PLAN_SHA256': canonical_sha256(plan), 'RAILWAY_GIT_COMMIT_SHA': 'a' * 40,
              'NEWS_CARD_IDEMPOTENCY_JOURNAL_ROOT': '/not-provisioned'}
          try:
              TrialGenerationGate.from_env(env)
          except TrialGenerationDenied as exc:
              assert str(exc) == 'trial_generation_release_mismatch'
          else:
              raise AssertionError('unstamped_trial_admitted')
          assert not pathlib.Path('/not-provisioned').exists()
          print(json.dumps({'ordinary_unstamped_build_allowed': True, 'trial_admission_denied': True,
              'network_calls': False, 'database_calls': False, 'production_proof': False}))
          PY

  courier-trial-image:
    name: Trial courier actual image OFF and synthetic validate-only (no delivery)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the existing isolated courier image
        run: >-
          docker build --file Dockerfile.private-review-card
          --build-arg RAILWAY_GIT_COMMIT_SHA=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          --tag coineasy-ybo-courier-ci .
      - name: New trial entrypoint is default-OFF without credentials or network
        shell: bash
        run: |
          set -euo pipefail
          output="$(docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges -e PYTHONDONTWRITEBYTECODE=1 coineasy-ybo-courier-ci \
            python -m scripts.run_trial_private_review_cards)"
          jq -e '. == {"ok":true,"status":"disabled","attempted_cards":0,
            "cards_recorded":0,"confirmed_parts":0,"invocation_dispatch_enabled":false,
            "public_send_attempted":false}' <<< "$output"
      - name: Real-image validate-only checks synthetic policy without clients or I/O
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python coineasy-ybo-courier-ci - <<'PY'
          import json, os, sys
          def no_io(event, args):
              if event in ('socket.connect', 'socket.bind', 'sqlite3.connect'):
                  raise AssertionError('external_io_forbidden')
          sys.addaudithook(no_io)
          import httpx
          from core.content_ops.trial_courier_adapter import canonical_sha256
          from scripts.run_trial_private_review_cards import run
          def forbidden(*args, **kwargs):
              raise AssertionError('validate_only_constructed_transport')
          httpx.AsyncClient = httpx.Client = httpx.AsyncHTTPTransport = forbidden
          # Same synthetic existing-policy shape as the local courier tests.
          # No live destination, provider, DB or control-plane credentials.
          policy = {'schema': 'existing-review-bot-policy@1', 'bot_id': 123456789,
              'chat_id': -1001234567890, 'room_binding': 'fixture-existing-owner-room-v1',
              'membership_status': 'administrator'}
          env = {**os.environ, 'CONTENT_OPS_TRIAL_COURIER_ENABLED': 'false',
              'CONTENT_OPS_REVIEW_ENABLED': 'false', 'CONTENT_OPS_BUTTON_CARD_ENABLED': 'false',
              'CONTENT_OPS_DAILY_BUTTON_CARD_ENABLED': 'false', 'CONTENT_OPS_REVIEW_MODE': 'daily',
              'CONTENT_OPS_REVIEW_PACKET_MODE': 'daily_button_card_v1', 'CONTENT_OPS_REVIEW_CANARY_VERSION_ID': '',
              'CONTENT_OPS_GATEWAY_URL': 'https://coineasy-newscard.netlify.app',
              'CONTENT_OPS_GATEWAY_TOKEN': 'fixture_gateway_' + 'c' * 40,
              'CONTENT_OPS_REVIEW_RELEASE_SHA': 'a' * 40, 'RAILWAY_GIT_COMMIT_SHA': 'a' * 40,
              'CONTENT_STUDIO_WORKSPACE_ID': '11111111-1111-4111-8111-111111111111',
              'TELEGRAM_REVIEW_BOT_TOKEN': '123456789:' + 'b' * 35,
              'TELEGRAM_REVIEW_CHAT_ID': '-1001234567890',
              'CONTENT_OPS_BUTTON_SIGNING_KEY': '1' * 64, 'CONTENT_OPS_EDIT_BINDING_KEY': '2' * 64,
              'CONTENT_OPS_EXISTING_REVIEW_BOT_POLICY_JSON': json.dumps(policy),
              'CONTENT_OPS_TRIAL_ID': '22222222-2222-4222-8222-222222222222',
              'CONTENT_OPS_TRIAL_PLAN_SHA256': 'b' * 64,
              'CONTENT_OPS_TRIAL_DESTINATION_POLICY_SHA256': canonical_sha256(policy)}
          for flag in ('false', 'true'):
              env['CONTENT_OPS_TRIAL_COURIER_ENABLED'] = flag
              receipt = run(validate_only=True, environ=env, runner=forbidden)
              assert receipt == {'ok': True, 'mode': 'validate_only', 'enabled': flag == 'true',
                  'network_calls': False, 'database_calls': False, 'telegram_calls': False,
                  'public_send_attempted': False, 'provenance': {
                      'schema_version': 'private-card-runtime-provenance@1',
                      'build_release_verified': True, 'runtime_git_sha_state': 'match',
                      'runtime_release_verified': True}}
          env['RAILWAY_GIT_COMMIT_SHA'] = 'f' * 40
          assert run(validate_only=True, environ=env, runner=forbidden)['ok'] is False
          print(json.dumps({'actual_image_trial_imports': True, 'synthetic_validate_only': True,
              'runtime_sha_mismatch_denied': True, 'network_calls': False,
              'database_calls': False, 'telegram_calls': False, 'production_proof': False}))
          PY
