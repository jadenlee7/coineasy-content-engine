name: YBO trial local proof

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  exact-natural-claim-postgres17:
    name: Exact YBO claim, logo context and JSONB digest on disposable PostgreSQL 17.6
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      EXACT_CLAIM_LOCAL_CI: "true"
      EXACT_CLAIM_DISPOSABLE_DATABASE: postgres
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install local proof dependencies
        run: python -m pip install -r requirements.txt
      - name: Bootstrap disposable Supabase-compatible schema
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap_local_postgres.sql
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          create function auth.role() returns text language sql stable as
          $$select current_setting('request.jwt.claim.role', true)$$;
          SQL
          # Same PG17 dependency cutoff as the reviewed disposable local harness.
          # No proposal, live credential, production migration or remote DB.
          for migration in supabase/migrations/*.sql; do
            base="${migration##*/}"
            if [[ "$base" < "20260901120000" ]]; then
              psql -X -v ON_ERROR_STOP=1 -f "$migration"
            fi
          done
      - name: Verify rollback-only claim and logo context, preserved ACL, and Python JSONB SHA
        run: python ops/ybo-server-trial/exact_claim_local_unittest.py --local-only
      - name: Verify exact preserved Babylon handoff and immutable successor anchor
        run: python ops/ybo-preserved-recovery/recovery_local_unittest.py --local-only
      - name: Verify fresh Babylon natural slot and preserved historical rows
        run: python ops/ybo-fresh-babylon/fresh_local_unittest.py --local-only
      - name: Record proof boundary
        if: always()
        run: |
          printf '%s\n' 'disposable_postgres_only=true' 'production_calls=0' \
            'provider_calls=0' 'telegram_calls=0' 'deployment_evidence=false'
