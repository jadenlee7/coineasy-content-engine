name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt \
            pytest==8.4.2 \
            pytest-asyncio==1.2.0
      - name: Run Python tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: .
        run: python -m pytest -p no:cacheprovider -q

  automation-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Official X automation image
        run: >-
          docker build
          --file Dockerfile.automation
          --tag coineasy-official-x-ci
          .
      - name: Prove the recovery CLI is packaged
        run: >-
          docker run --rm --network none
          coineasy-official-x-ci
          python -m scripts.run_squid_failed_draft_recovery --help
      - name: Prove a self-declared release cannot reach the database
        run: |
          set +e
          output="$(docker run --rm --network none \
            --env SUPABASE_URL=https://project-ref.supabase.co \
            --env SUPABASE_SERVICE_ROLE_KEY=ssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssss \
            --env CONTENT_STUDIO_WORKSPACE_ID=11111111-1111-4111-8111-111111111111 \
            --env X_BEARER_TOKEN=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \
            --env STUDIO_BASE_URL=https://coineasy-newscard.netlify.app \
            --env STUDIO_AUTOMATION_TOKEN=tttttttttttttttttttttttttttttttttttttttt \
            --env OFFICIAL_X_RECOVERY_RELEASE_SHA=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --env RAILWAY_GIT_COMMIT_SHA=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --env RAILWAY_ENVIRONMENT_NAME=production \
            coineasy-official-x-ci \
            python -m scripts.run_squid_failed_draft_recovery authorize \
            --job-id 33333333-3333-4333-8333-333333333333 \
            --recovery-id 66666666-6666-4666-8666-666666666666 \
            --release-sha aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --approval-id 77777777-7777-4777-8777-777777777777 \
            --approved-by ci:release-fence \
            --approved-at 2026-08-25T08:00:00Z \
            --expires-at 2026-08-25T09:00:00Z \
            --subject-sha256 5555555555555555555555555555555555555555555555555555555555555555)"
          status=$?
          set -e
          test "$status" -eq 2
          test "$output" = '{"ok":false,"error":"recovery_configuration_invalid"}'

  grok-qa-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the isolated advisory Grok QA image
        run: >-
          docker build
          --file Dockerfile.grok-qa
          --tag coineasy-grok-qa-ci
          .
      - name: Prove the scheduled worker holds without network or credentials
        run: |
          docker run --rm --network none \
            --env GROK_QA_DISPATCH_ENABLED=false \
            coineasy-grok-qa-ci \
          | python -c 'import json, sys; result = json.load(sys.stdin); assert result == {"ok": True, "enabled": False, "mode": "hold", "reason": "grok_qa_dispatch_disabled", "provider_calls": False, "database_calls": False, "relay_calls": False, "publication_calls": False}'
      - name: Validate exact provider, client, environment, and release fences without I/O
        run: |
          docker run --rm --network none \
            --env GROK_QA_DISPATCH_ENABLED=false \
            --env GROK_QA_DISPATCH_URL=https://coineasy-newscard.netlify.app/api/grok-qa/dispatch \
            --env GROK_QA_DISPATCH_TOKEN=dispatch-token-that-is-dedicated-and-long-enough \
            --env XAI_API_KEY=xai-ci-key-that-is-dedicated-and-long-enough \
            --env GROK_QA_MODEL=grok-4.5 \
            --env GROK_QA_ALLOWED_CLIENTS=squid \
            --env RAILWAY_ENVIRONMENT_NAME=production \
            --env GROK_QA_EXPECTED_ENVIRONMENT=production \
            --env RAILWAY_GIT_COMMIT_SHA=dddddddddddddddddddddddddddddddddddddddd \
            --env GROK_QA_RELEASE_SHA=dddddddddddddddddddddddddddddddddddddddd \
            coineasy-grok-qa-ci \
            python -m scripts.run_grok_qa_dispatch --validate-only \
          | python -c 'import json, sys; result = json.load(sys.stdin); assert result == {"ok": True, "enabled": False, "mode": "validate_only", "model": "grok-4.5", "allowed_clients": ["squid"], "canary_mode": False, "canary_target_configured": False, "max_source_age_seconds": 86400, "runtime_environment_verified": True, "runtime_release_verified": True, "provider_calls": False, "database_calls": False, "relay_calls": False, "publication_calls": False}'
      - name: Prove the image has no publication or source-monitor modules
        run: |
          docker run --rm --network none coineasy-grok-qa-ci \
            python -c 'import importlib.util; assert importlib.util.find_spec("core.publishers") is None; assert importlib.util.find_spec("core.sources") is None; assert importlib.util.find_spec("core.automation") is None'

  batch-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Railway Batch dispatcher image
        run: >-
          docker build
          --file Dockerfile.batch
          --tag coineasy-batch-ci
          .
      - name: Run the built image without DB or provider calls
        run: |
          docker run --rm --network none \
            --env BATCH_EXPERIMENT_MODE=dry_run \
            coineasy-batch-ci \
            python -m scripts.run_batch_dispatcher --dry-run \
          | python -c 'import json, sys; result = json.load(sys.stdin); assert result["ok"] is True; assert result["mode"] == "dry_run"; assert result["provider_calls"] is False'
      - name: Preflight the live canary with networking disabled
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from decimal import Decimal
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from core.batch.canary import (
              CONFIG_SCHEMA,
              DISPATCH_SCHEMA,
              canonical_sha256,
              config_subject,
              dispatch_subject,
          )

          now = datetime.now(timezone.utc)
          start = now.astimezone(ZoneInfo("Asia/Seoul")).replace(
              hour=0, minute=0, second=0, microsecond=0
          )
          end = start + timedelta(hours=48)
          approved_at = now - timedelta(minutes=5)
          expires_at = now + timedelta(hours=1)
          utc_text = lambda value: value.astimezone(timezone.utc).isoformat().replace("+00:00", "Z")

          values = {
              "BATCH_EXPERIMENT_MODE": "live",
              "BATCH_ALLOWED_CLIENTS": "origintrail",
              "BATCH_DAILY_CAP_USD": "0.05",
              "BATCH_MAX_CLAIMS": "1",
              "BATCH_MAX_REQUESTS_PER_BATCH": "1",
              "BATCH_TIMEZONE": "Asia/Seoul",
              "BATCH_EXPERIMENT_START_AT": start.isoformat(),
              "BATCH_EXPERIMENT_END_AT": end.isoformat(),
              "BATCH_CANARY_ENABLED": "true",
              "BATCH_CANARY_ENVIRONMENT": "staging",
              "RAILWAY_ENVIRONMENT_NAME": "staging",
              "BATCH_CANARY_RELEASE_SHA": "a" * 40,
              "RAILWAY_GIT_COMMIT_SHA": "a" * 40,
              "SUPABASE_URL": "https://ci.supabase.co",
              "SUPABASE_SERVICE_ROLE_KEY": "s" * 40,
              "CONTENT_STUDIO_WORKSPACE_ID": "11111111-1111-4111-8111-111111111111",
              "OPENAI_API_KEY": "sk-ci-key-that-is-long-enough",
          }
          digest = canonical_sha256(config_subject(
              environment=values["BATCH_CANARY_ENVIRONMENT"],
              release_sha=values["BATCH_CANARY_RELEASE_SHA"],
              supabase_url=values["SUPABASE_URL"],
              workspace_id=values["CONTENT_STUDIO_WORKSPACE_ID"],
              allowed_clients=frozenset({"origintrail"}),
              daily_cap_usd=Decimal(values["BATCH_DAILY_CAP_USD"]),
              max_claims=int(values["BATCH_MAX_CLAIMS"]),
              max_requests_per_batch=int(
                  values["BATCH_MAX_REQUESTS_PER_BATCH"]
              ),
              experiment_start_at=datetime.fromisoformat(
                  values["BATCH_EXPERIMENT_START_AT"]
              ),
              experiment_end_at=datetime.fromisoformat(
                  values["BATCH_EXPERIMENT_END_AT"]
              ),
              timezone_name=values["BATCH_TIMEZONE"],
          ))
          values["BATCH_CANARY_APPROVAL_RECEIPT"] = json.dumps({
              "version": CONFIG_SCHEMA,
              "approval_id": "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa",
              "approved_by": "operator:ci",
              "approved_at": utc_text(approved_at),
              "expires_at": utc_text(expires_at),
              "subject_sha256": digest,
          }, separators=(",", ":"))
          dispatch = dispatch_subject(
              config_subject_sha256=digest,
              config_approval_id="aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa",
              job_id="22222222-2222-4222-8222-222222222222",
              input_sha256="c" * 64,
              request_sha256="d" * 64,
          )
          values["BATCH_CANARY_DISPATCH_RECEIPT"] = json.dumps({
              "version": DISPATCH_SCHEMA,
              "dispatch_approval_id": "bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb",
              "approved_by": "operator:ci",
              "approved_at": utc_text(approved_at),
              "expires_at": utc_text(expires_at),
              "job_id": "22222222-2222-4222-8222-222222222222",
              "input_sha256": "c" * 64,
              "request_sha256": "d" * 64,
              "subject_sha256": canonical_sha256(dispatch),
          }, separators=(",", ":"))
          Path("/tmp/coineasy-batch-preflight.env").write_text(
              "".join(f"{name}={value}\n" for name, value in values.items())
          )
          PY
          docker run --rm --network none \
            --env-file /tmp/coineasy-batch-preflight.env \
            coineasy-batch-ci \
            python -m scripts.run_batch_dispatcher --preflight-live \
          | python -c 'import json, sys; result = json.load(sys.stdin); assert result["ok"] is True; assert result["config_approval_phase"] == "active"; assert result["dispatch_phase"] == "active"; assert result["canary_dispatch"]["request_sha256"] == "d" * 64; assert result["runtime_environment_verified"] is True; assert result["runtime_release_verified"] is True; assert result["database_calls"] is False; assert result["provider_calls"] is False; assert result["submissions_enabled"] is False'

  buzz-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned Buzz delivery image
        run: >-
          docker build
          --file Dockerfile.buzz-delivery
          --tag coineasy-buzz-delivery-ci
          .
      - name: Prove the scheduled worker holds without network or credentials
        run: |
          docker run --rm --network none \
            --env BUZZ_DELIVERY_ENABLED=false \
            coineasy-buzz-delivery-ci \
            python -m scripts.run_origintrail_buzz_delivery --send-once \
          | python -c 'import json, sys; result = json.load(sys.stdin); assert result == {"ok": True, "enabled": False, "mode": "hold", "reason": "buzz_delivery_disabled", "provider_calls": False, "database_calls": False, "shadow_calls": False}'
      - name: Validate the delivery release fence without network calls
        run: |
          docker run --rm --network none \
            --env BUZZ_DELIVERY_ENABLED=false \
            --env BUZZ_DELIVERY_ALLOWED_CLIENTS=origintrail \
            --env BUZZ_SHADOW_URL=https://console.example/api/buzz-shadow/origintrail/batch \
            --env BUZZ_DELIVERY_URL=https://console.example/api/buzz-delivery/origintrail \
            --env BUZZ_SHADOW_ACCESS_TOKEN=shadow-token-that-is-dedicated-and-long-enough \
            --env BUZZ_DELIVERY_WORKER_TOKEN=delivery-token-that-is-dedicated-and-long-enough \
            --env BUZZ_RELAY_URL=https://buzz.example \
            --env BUZZ_PRIVATE_KEY=1111111111111111111111111111111111111111111111111111111111111111 \
            --env BUZZ_CHANNEL_ID=33333333-3333-4333-8333-333333333333 \
            --env RAILWAY_GIT_COMMIT_SHA=dddddddddddddddddddddddddddddddddddddddd \
            --env BUZZ_DELIVERY_RELEASE_SHA=dddddddddddddddddddddddddddddddddddddddd \
            coineasy-buzz-delivery-ci \
            python -m scripts.run_origintrail_buzz_delivery --validate-only \
          | python -c 'import json, sys; result = json.load(sys.stdin); assert result == {"ok": True, "mode": "validate_only", "enabled": False, "client_id": "origintrail", "channel_id": "33333333-3333-4333-8333-333333333333", "runtime_release_verified": True, "provider_calls": False, "database_calls": False, "shadow_calls": False}'

  buzz-review-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned Buzz review image
        run: >-
          docker build
          --file Dockerfile.buzz-review
          --tag coineasy-buzz-review-ci
          .
      - name: Prove the review scanner holds without network or credentials
        run: |
          docker run --rm --network none \
            --env BUZZ_REVIEW_ENABLED=false \
            coineasy-buzz-review-ci \
            python -m scripts.run_origintrail_buzz_review --scan-once \
          | python -c 'import json, sys; result = json.load(sys.stdin); assert result == {"ok": True, "enabled": False, "mode": "hold", "reason": "buzz_review_disabled", "provider_calls": False, "publication_calls": False, "database_calls": False, "relay_calls": False}'
      - name: Validate every review identity and deployment fence without I/O
        run: |
          docker run --rm --network none \
            --env BUZZ_REVIEW_URL=https://console.example/api/buzz-review/origintrail \
            --env BUZZ_REVIEW_WORKER_TOKEN=review-token-that-is-dedicated-and-long-enough \
            --env BUZZ_RELAY_URL=https://buzz.example \
            --env BUZZ_PRIVATE_KEY=1111111111111111111111111111111111111111111111111111111111111111 \
            --env BUZZ_CHANNEL_ID=33333333-3333-4333-8333-333333333333 \
            --env BUZZ_REVIEWER_PUBKEYS=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --env BUZZ_SERVICE_PUBKEY=cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc \
            --env RAILWAY_ENVIRONMENT_NAME=staging \
            --env BUZZ_REVIEW_EXPECTED_ENVIRONMENT=staging \
            --env RAILWAY_GIT_COMMIT_SHA=dddddddddddddddddddddddddddddddddddddddd \
            --env BUZZ_REVIEW_RELEASE_SHA=dddddddddddddddddddddddddddddddddddddddd \
            --env BUZZ_REVIEW_PROTOCOL_START_EPOCH=1700000000 \
            coineasy-buzz-review-ci \
            python -m scripts.run_origintrail_buzz_review --validate-only \
          | python -c 'import json, sys; result = json.load(sys.stdin); assert result == {"ok": True, "mode": "validate_only", "enabled": False, "client_id": "origintrail", "channel_id": "33333333-3333-4333-8333-333333333333", "reviewer_count": 1, "acknowledgement_enabled": False, "durable_acknowledgement_enabled": False, "provider_calls": False, "publication_calls": False, "database_calls": False, "relay_calls": False}'

  publication-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the exact Telegram publication worker image
        run: >-
          docker build
          --file Dockerfile.publication
          --tag coineasy-publication-ci
          .
      - name: Validate the built worker without provider or database calls
        run: |
          docker run --rm --network none \
            --env TELEGRAM_PUBLICATION_ENABLED=false \
            --env TELEGRAM_PUBLICATION_ALLOWED_CLIENTS=squid \
            --env TELEGRAM_PUBLICATION_LEASE_SECONDS=180 \
            --env TELEGRAM_PUBLICATION_MAX_CLAIMS=1 \
            --env SUPABASE_URL=https://ci.supabase.co \
            --env SUPABASE_SERVICE_ROLE_KEY=ssssssssssssssssssssssssssssssssssssssss \
            --env CONTENT_STUDIO_WORKSPACE_ID=11111111-1111-4111-8111-111111111111 \
            --env TELEGRAM_BOT_TOKEN_SQUID=123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijk12345 \
            --env TELEGRAM_CHANNEL_SQUID=@squid_kor_update \
            --env RAILWAY_GIT_COMMIT_SHA=dddddddddddddddddddddddddddddddddddddddd \
            --env TELEGRAM_PUBLICATION_RELEASE_SHA=dddddddddddddddddddddddddddddddddddddddd \
            coineasy-publication-ci \
            python -m scripts.run_telegram_publications --validate-only \
          | python -c 'import json, sys; result = json.load(sys.stdin); assert result == {"ok": True, "mode": "validate_only", "enabled": False, "client_id": "squid", "public_username": "squid_kor_update", "runtime_release_verified": True, "provider_calls": False, "database_calls": False}'
      - name: Reject a mismatched publication release without network or I/O
        run: |
          output="$(mktemp)"
          set +e
          docker run --rm --network none \
            --env TELEGRAM_PUBLICATION_ENABLED=false \
            --env TELEGRAM_PUBLICATION_ALLOWED_CLIENTS=squid \
            --env TELEGRAM_PUBLICATION_LEASE_SECONDS=180 \
            --env TELEGRAM_PUBLICATION_MAX_CLAIMS=1 \
            --env SUPABASE_URL=https://ci.supabase.co \
            --env SUPABASE_SERVICE_ROLE_KEY=ssssssssssssssssssssssssssssssssssssssss \
            --env CONTENT_STUDIO_WORKSPACE_ID=11111111-1111-4111-8111-111111111111 \
            --env TELEGRAM_BOT_TOKEN_SQUID=123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijk12345 \
            --env TELEGRAM_CHANNEL_SQUID=@squid_kor_update \
            --env RAILWAY_GIT_COMMIT_SHA=dddddddddddddddddddddddddddddddddddddddd \
            --env TELEGRAM_PUBLICATION_RELEASE_SHA=eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee \
            coineasy-publication-ci \
            python -m scripts.run_telegram_publications --validate-only \
            > "$output"
          status="$?"
          set -e
          test "$status" -eq 1
          python -c 'import json, sys; result = json.load(sys.stdin); assert result == {"ok": False, "mode": "validate_only", "error": "telegram_publication_validation_failed", "provider_calls": False, "database_calls": False}' \
            < "$output"
      - name: Run the built image with publication disabled
        run: |
          docker run --rm --network none \
            --env TELEGRAM_PUBLICATION_ENABLED=false \
            coineasy-publication-ci \
          | python -c 'import json, sys; result = json.load(sys.stdin); assert result == {"ok": True, "enabled": False, "processed": 0, "failures": 0, "results": []}'

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Run Netlify function and console tests
        run: npm run test:functions
      - name: Build Netlify site
        env:
          COMMIT_REF: ${{ github.sha }}
        run: npx --yes netlify-cli@27.0.1 build --offline --context production
      - name: Verify the build-stamped Netlify release
        env:
          EXPECTED_STUDIO_RELEASE_SHA: ${{ github.sha }}
        run: >-
          node --test
          tests_js/studio-release-stamp.test.mts
          tests_js/studio-capabilities.test.mts

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap disposable Supabase-compatible roles
        run: >-
          psql -X -v ON_ERROR_STOP=1
          -f supabase/tests/bootstrap_local_postgres.sql
      - name: Apply every migration in timestamp order
        run: |
          for migration in supabase/migrations/*.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run transactional SQL security smoke tests
        run: |
          for smoke in supabase/tests/*_security.sql \
                       supabase/tests/*_least_privilege.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$smoke"
          done
      - name: Prove Content QA concurrency fences
        run: bash supabase/tests/content_qa_jobs_concurrency.sh
      - name: Serialize Squid recovery behind official X intake
        run: >-
          bash
          supabase/tests/squid_failed_draft_recovery_concurrency.sh
