name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run Python tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: .
        run: python -m pytest -p no:cacheprovider -q

  batch-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Railway Batch dispatcher image
        run: >-
          docker build
          --file Dockerfile.batch
          --tag coineasy-batch-ci
          .
      - name: Run the built image without DB or provider calls
        run: |
          docker run --rm \
            --env BATCH_EXPERIMENT_MODE=dry_run \
            coineasy-batch-ci \
            python -m scripts.run_batch_dispatcher --dry-run \
          | python -c 'import json, sys; result = json.load(sys.stdin); assert result["ok"] is True; assert result["mode"] == "dry_run"; assert result["provider_calls"] is False'

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Run Netlify function and console tests
        run: npm run test:functions
      - name: Build Netlify site
        run: npx --yes netlify-cli@27.0.1 build

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap disposable Supabase-compatible roles
        run: >-
          psql -X -v ON_ERROR_STOP=1
          -f supabase/tests/bootstrap_local_postgres.sql
      - name: Apply every migration in timestamp order
        run: |
          for migration in supabase/migrations/*.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run transactional SQL security smoke tests
        run: |
          for smoke in supabase/tests/*_security.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$smoke"
          done
