name: Private review recovery proof
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  recovery-postgres:
    name: Append-only recovery on disposable PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.9'
      - name: Verify original-row preservation, one claim, four-part dedupe and terminal
        run: python ops/private-review-recovery/run_local.py --local-only
      - name: Verify exact standalone successor, preimages, ACLs and cross-tuple denial
        run: python ops/private-review-recovery-successor/run_local.py --ci-only
