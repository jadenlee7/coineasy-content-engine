client_id: yellow
name: Yellow Network
locale: ko-KR
active: true

brand:
  primary_color: "#FFDE00"
  bg_dark: "#000000"
  bg_yellow: "#FFDE00"
  text_primary: "#0A0A0A"
  text_body: "#595959"
  logo_dark: assets/logo_dark.png        # 다크 배경용 (흰색 로고)
  logo_light: assets/logo_light.png      # 밝은 배경용 (검정 로고)
  font_family: "Pretendard Variable"

content_sources:
  twitter:
    handle: "@Yellow"                     # 글로벌 공식 계정
    poll_interval_min: 30
  blog_rss:
    - "https://medium.com/yellow-blog/feed"

llm:
  edu_carousel:
    model: "claude-sonnet-4-6"
    temperature: 0.3
    tone_guidance: >
      Professional but approachable. 경어체 (합니다/습니다).
      Technical but beginner-friendly. 크립토 초보자도 이해할 수 있게.
    preserve_terms:
      - "Nitrolite"
      - "Clearnode"
      - "Yellow SDK"
      - "$YELLOW"
      - "State Channel"
      - "NeoDAX"
      - "XRPL"
      - "EVM"
    glossary:
      "chain-agnostic": "체인을 가리지 않는"
      "state channel": "스테이트 채널(state channel)"
      "state channels": "스테이트 채널(state channels)"
      "non-custodial": "논커스터디얼(non-custodial)"
      "clearing": "클리어링(clearing)"
      "settlement": "정산(settlement)"
      "Layer 3": "Layer 3"
      "cross-chain": "크로스체인(cross-chain)"
      "real-world asset": "실물 자산(real-world asset)"
      "gas fees": "가스비(gas fees)"
      "off-chain": "오프체인(off-chain)"
      "on-chain": "온체인(on-chain)"
      "smart contract": "스마트 컨트랙트(smart contract)"

  news_banner:
    model: "claude-sonnet-4-6"
    temperature: 0.2

publishing:
  telegram:
    public_channel: "@YellowKorea_ann"
    # approval_channel_id: -1001234567890     # 제이든+Kailey 승인 채널 ID
    bot_token_env: "TELEGRAM_BOT_TOKEN_YELLOW"
  twitter:
    typefully_account_id: "yellow_kr"
  discord:
    enabled: false

feature_flags:
  auto_approve: false
  education_carousel: true
  news_banner: true

routing:
  # 1차 필터 - LLM 부르기 전에 제외할 패턴들
  skip_patterns:
    - "Day 1"
    - "Day 2"
    - "on the ground"
    - "Premier Sponsor"
    - "AMA:"
    - "How much"
    - "What do you think"
    - "Live in"
    - "15 minutes"

  # 교육 캐러셀 후보 신호
  edu_signals:
    - "by design"
    - "chain-agnostic"
    - "protocol"
    - "architecture"
    - "infrastructure"
    - "enables"
    - "state channel"
    - "the WHY"
    - "explainer"
    - "here's how"
    - "nitrolite"
    - "clearnode"
    - "SDK"

  # 뉴스 배너 후보 신호
  news_signals:
    - "partnership"
    - "partner"
    - "live on"
    - "mainnet"
    - "launch"
    - "launched"
    - "listing"
    - "integration"
    - "now supports"
    - "milestone"
