<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir>/tmp/coineasy-fontconfig-cache</cachedir>

  <alias>
    <family>Gmarket Sans</family>
    <prefer><family>Pretendard Variable</family></prefer>
  </alias>
  <alias>
    <family>Pretendard</family>
    <prefer><family>Pretendard Variable</family></prefer>
  </alias>
  <alias>
    <family>Inter</family>
    <prefer><family>Pretendard Variable</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Pretendard Variable</family></prefer>
  </alias>
</fontconfig>
